<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} | دکتر حکیم</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #0f4c3a !important; background-image: radial-gradient(circle at center, #1a6b52 0%, #0f4c3a 100%) !important; color: #f8fafc; }
        .brand-gold { color: #d4af37; }
        .brand-bg-gold { background-color: #d4af37; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .article-content p { line-height: 2.2; color: #cbd5e1; margin-bottom: 1.5rem; text-align: justify; }
        .article-content h2 { color: #d4af37; font-size: 1.5rem; font-weight: 800; margin-top: 2.5rem; margin-bottom: 1rem; border-bottom: 2px solid rgba(212, 175, 55, 0.3); padding-bottom: 0.5rem; }
        .article-content strong { color: #ffffff; }
    </style>
</head>
<body class="antialiased min-h-screen">
    <header class="fixed w-full top-0 z-50 glass-card">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/" class="flex items-center gap-2"><span class="text-2xl">🌿</span><h1 class="text-xl font-bold text-white">دکتر حکیم</h1></a>
            <a href="/chat" class="brand-bg-gold text-gray-900 px-6 py-2 rounded-full text-sm font-bold hover:bg-yellow-400 transition">شروع مشاوره</a>
        </div>
    </header>

    <main class="pt-32 pb-20">
        <div class="container mx-auto px-4 max-w-4xl">
            <h1 class="text-3xl md:text-5xl font-extrabold text-white text-center mb-10 leading-tight">{{TITLE}}</h1>
            <article class="glass-card p-8 md:p-12 rounded-3xl article-content">
                {{CONTENT}}
                <div class="mt-8 pt-6 border-t border-gray-600">
                    <h4 class="text-white font-bold mb-4">مطالب مرتبط:</h4>
                    <ul class="list-disc list-inside text-gray-300 space-y-2">
                        <li><a href="/article/hair-loss-fear" class="hover:text-yellow-400">راز علمی ریزش مو و استرس پنهان</a></li>
                        <li><a href="/article/fatty-liver-anger" class="hover:text-yellow-400">راز کبد چرب و خشم پنهان</a></li>
                        <li><a href="/article/insomnia-grudge" class="hover:text-yellow-400">راز بی‌خوابی و کینه‌های پنهان</a></li>
                    </ul>
                </div>
            </article>
            <div class="mt-12 text-center">
                <a href="/chat" class="inline-block brand-bg-gold text-gray-900 font-black px-10 py-4 rounded-xl text-lg hover:bg-yellow-400 transition shadow-[0_0_20px_rgba(212,175,55,0.4)]">دریافت تحلیل تخصصی (۵۰٪ تخفیف)</a>
            </div>
        </div>
    </main>

    <!-- اسکریپت Tailwind در انتهای صفحه -->
    <script src="https://cdn.tailwindcss.com"></script>
</body>
</html>
